<script>
// Motore di Esportazione 1:1, 4:5, 9:16, 1:2
function exportSocial(ratio) {
  var canvas = document.getElementById('match-canvas');
  var header = document.getElementById('export-header');
  var footer = document.getElementById('export-footer');
  
  // Salva stili originali
  var originalWidth = canvas.style.width;
  var originalHeight = canvas.style.height;
  var originalTransform = canvas.style.transform;
  var originalPadding = canvas.style.padding;
  
  // Set the specific dimensions (Base resolution 1080p wide)
  var w = 1080;
  var h = 1080;
  if(ratio === '4:5') h = 1350;
  if(ratio === '9:16') h = 1920;
  if(ratio === '1:2') h = 2160;

  // Mostra header e footer brandizzati
  header.style.display = 'block';
  footer.style.display = 'block';
  
  // Applica stile geometrico forzato al contenitore
  // Usa lo zoom per far sembrare il testo proporzionato a 1080px
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.style.padding = '80px';
  canvas.style.boxSizing = 'border-box';
  canvas.style.display = 'flex';
  canvas.style.flexDirection = 'column';
  canvas.style.justifyContent = 'center';
  canvas.style.fontSize = '24px'; // Scale up baseline
  
  // Html2Canvas prende screenshot
  html2canvas(canvas, {
    width: w,
    height: h,
    scale: 1, // 1x is exactly 1080p
    backgroundColor: getComputedStyle(document.body).getPropertyValue('--bg').trim()
  }).then(function(c) {
    var link = document.createElement('a');
    link.download = 'DataNapoli-' + '1986-08-24' + '-' + ratio.replace(':','x') + '.png';
    link.href = c.toDataURL();
    link.click();
    
    // Ripristina tutto
    canvas.style.width = originalWidth;
    canvas.style.height = originalHeight;
    canvas.style.padding = originalPadding;
    canvas.style.display = 'block';
    canvas.style.fontSize = '';
    header.style.display = 'none';
    footer.style.display = 'none';
  });
}
</script>
