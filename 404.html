<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/sscnapolidata/" />
    <script>
      // Clear legacy service worker & caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }
      window.location.replace('/sscnapolidata/');
    </script>
    <title>SSC Napoli Data</title>
  </head>
  <body>
    <p>Reindirizzamento a <a href="/sscnapolidata/">SSC Napoli Data</a>...</p>
  </body>
</html>
